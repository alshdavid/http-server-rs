[package]
name = "http-server-rs"
version = "0.0.0-local"
edition = "2021"
description = "Simple, zero-configuration command-line static HTTP server."
license = "MIT"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined-format-args = "allow"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
futures = "0.3.34"
handlebars = "6.4.4"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1"] }
hyper-util = { version = "0.1.20", features = ["server-graceful"] }
mime_guess = "2.0.5"
normalize-path = "0.2.1"
notify-debouncer-full = "0.7.0"
num_cpus = "1.17.0"
pathdiff = "0.2.3"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "fs", "net"] }
tokio-util = { version = "0.7.19", features = [
  "io",
  "io-util",
  "futures-util",
] }
brotli = "9.0.0"
urlencoding = "2.1.3"
base64 = "0.23.1"
oxc = { version = "0.150.0", features = ["transformer", "codegen", "semantic"] }

[target.'cfg(unix)'.dependencies]
unix_mode = "0.1.4"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
