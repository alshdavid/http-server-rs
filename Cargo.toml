[package]
name = "http-server-rs"
# version = "0.0.0-local"
version = "0.0.1"
edition = "2021"
description = "Simple, zero-configuration command-line static HTTP server."
license = "MIT"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined_format_args = "allow"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
flate2 = "1.1.5"
futures = "0.3.34"
handlebars = "6.4.4"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-util = { version = "0.1.21", features = [
  "server-graceful",
  "client",
  "client-legacy",
  "http1",
] }
mime_guess = "2.0.5"
normalize-path = "0.2.2"
notify-debouncer-full = "0.7.0"
num_cpus = "1.17.0"
octocrab = "0.54.3"
pathdiff = "0.2.3"
regex = "1.13.1"
reqwest = "0.13.5"
semver = "1.0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_qs = "1.1.3"
tar = "0.4.44"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "fs", "net", "signal"] }
tokio-util = { version = "0.7.19", features = [
  "io",
  "io-util",
  "futures-util",
] }
brotli = "9.0.0"
urlencoding = "2.1.3"
base64 = "0.23.1"
oxc = { version = "0.153.0", features = ["transformer", "codegen", "semantic"] }

[target.'cfg(unix)'.dependencies]
unix_mode = "0.1.4"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
